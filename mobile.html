<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baseball data, 1980–2024</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body data-mode="mobile">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="folder" viewBox="0 0 24 24">
    <path d="M2.5 5h7l2.5 3H21.5v11h-19z M2.5 8v0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/>
  </symbol>
</svg>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="stage"></div>
<div id="spacer"></div>

<div id="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="hud-tl">Baseball data<span>1980–2024</span></div>
<a id="switch" href="desktop.html">Desktop version</a>
<nav id="rail" aria-label="Jump to a step"></nav>
<div id="readout" aria-live="polite"></div>
<div id="hint"><i></i>Swipe up to fly through the data</div>

<div id="veil"></div>
<aside id="panel" aria-hidden="true" aria-labelledby="panel-title">
  <header>
    <div><h3 id="panel-title"></h3><p id="panel-count"></p></div>
    <button id="panel-close" type="button">Close</button>
  </header>
  <div id="panel-body"></div>
</aside>

<script src="engine.js"></script>
</body>
</html>
