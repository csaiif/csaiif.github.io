<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baseball data web, 1980–2014</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="folder" viewBox="0 0 24 24">
    <path fill="currentColor" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.3 1.6.8L12 6.5h6.5A2.5 2.5 0 0 1 21 9v8.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/>
  </symbol>
  <symbol id="zip" viewBox="0 0 24 24">
    <path fill="currentColor" d="M5 3h9l5 5v13H5V3Zm8 1.5V9h4.5L13 4.5ZM10 5h2v2h-2V5Zm0 3h2v2h-2V8Zm-2 3h2v2H8v-2Zm2 3h2v2h-2v-2Zm2 3h-2v3h4v-3h-2Z" opacity=".95"/>
  </symbol>
</svg>

<!-- Background web -->
<svg id="bgweb" aria-hidden="true"></svg>

<button class="theme-toggle" id="themeToggle" type="button">Switch theme</button>

<main id="flow">
  <svg id="strands" aria-hidden="true"></svg>

  <!-- Step 1 -->
  <section class="stage s1" aria-label="Step 1: Raw data">
    <div class="folder-node" id="raw">
      <svg><use href="#folder"/></svg>
      <span class="t">Raw data 117GB 1980-2014 (fixed data)</span>
    </div>
  </section>

  <!-- Step 2 -->
  <section class="stage s2" aria-label="Step 2: Compression">
    <div class="folder-node zip-node" id="compress">
      <svg><use href="#zip"/></svg>
      <span class="t">Compression</span>
    </div>
  </section>

  <!-- Step 3 -->
  <section class="stage" aria-label="Step 3: Decade labeling">
    <h2 class="stage-head"><b>Decade labeling</b></h2>
    <div class="row decades" id="decades"></div>
  </section>

  <!-- Step 4 -->
  <section class="stage" aria-label="Step 4: Five-year range labeling">
    <h2 class="stage-head"><b>5-year range labeling</b></h2>
    <div class="row ranges" id="ranges"></div>
  </section>

  <!-- Step 5 -->
  <section class="stage" aria-label="Step 5: One year opened up" style="margin-bottom:0">
    <h2 class="stage-head"><b>Take one range, then one year</b>, and open it up</h2>
    <div class="year-wrap">
      <div class="folder-node picked" id="year">
        <svg><use href="#folder"/></svg>
        <span class="t">2004<span class="sub">inside the 2000–2005 range</span></span>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </section>
</main>

<script>
/* ---------- DATA ---------- */
const decades = [
  ["1980–1990", "1 decade (10 years)"],
  ["1990–2000", "1 decade (10 years)"],
  ["2000–2010", "1 decade (10 years)"],
  ["2010–2020", "1 decade (10 years)"],
  ["2020–2024", "0.4 decades (4 years)"],
];

const ranges = [
  "1980–1985","1985–1990","1990–1995","1995–2000","2000–2005",
  "2005–2010","2010–2015","2015–2020","2020-2024",
];
const PICKED_RANGE = "2000–2005";
// which decade each range belongs to (index into decades)
const rangeParent = [0,0,1,1,2,2,3,3,4];

const pitching = ["Air outs","At bats","Batting average","Balks","Walks","Batters faced","Blown saves","Catcher's interference","Caught stealing","Caught stealing percentage","Complete games","Doubles","Earned runs","Earned run average","Games finished","Games pitched","Games started","Grounded into double play","Ground outs","Ground outs to air outs ratio","Hit by pitch","Hits","Hits per 9 innings","Holds","Home runs","Home runs per 9 innings","Inherited runners","Inherited runners scored","Innings pitched","Intentional walks","Losses","Number of pitches","On-base percentage","On-base plus slugging","Outs","Pickoffs","Pitches per inning","Runs","Runs scored per 9 innings","Sacrifice bunts","Sacrifice flies","Save opportunities","Saves","Shutouts","Slugging percentage","Stolen base percentage","Stolen bases","Strikeouts","Strike percentage","Strikeout-to-walk ratio","Strikeouts per 9 innings","Strikes","Total bases","Triples","Walks per 9 innings","Walks plus hits per inning pitched","Wild pitches","Winning percentage","Wins"];
const fielding = ["Age","Assists","Catcher earned run average","Catcher's interference","Caught stealing","Caught stealing percentage","Chances","Double plays","Errors","Fielding percentage","Games played","Games started","Innings","Passed balls","Pickoffs","Position","Put outs","Range factor per 9 innings","Range factor per game","Stolen base percentage","Stolen bases","Throwing errors","Triple plays","Wild pitches"];
const hitting = ["Age","Air outs","At bats","At bats per home run","Batting average","Batting average on balls in play","Walks","Catcher's interference","Caught stealing","Caught stealing percentage","Doubles","Games played","Grounded into double play","Ground outs","Ground outs to air outs ratio","Hit by pitch","Hits","Home runs","Intentional walks","Left on base","Number of pitches","On-base percentage","On-base plus slugging","Plate appearances","Runs batted in","Runs","Sacrifice bunts","Sacrifice flies","Slugging percentage","Stolen base percentage","Stolen bases","Strikeouts","Total bases","Triples"];

// count: "xx" until you have the exact numbers, then replace with the real number
const categories = [
  { name: "Game", count: "xx", items: ["Attendance","Away score","Away team ID","Ballpark ID","Date","Game ID","Game type (includes postseason)","Home score","Home team ID","Losing pitcher ID","Save pitcher ID","Status","Venue name at the time","Winning pitcher ID"] },
  { name: "Teams", count: "xx", items: ["Active","Current name","Division","ID","League",
      { name: "Name history (past names only)", children: ["Name","Through year"] },
      { name: "Trophies", children: ["Division titles","Pennants","Wild cards","World Series"] } ] },
  { name: "Players", count: "xx", items: ["Bat side","Birth date","Death date","Debut date","Height","Last active season","Pitch hand","Status","Weight"] },
  { name: "Managers", count: "xx", items: ["Birth date","Death date","First season managed","Last season managed","Status"] },
  { name: "Player-stats", count: "xx", items: ["Player ID","Team ID","Stat group (pitching, fielding or hitting)",
      { name: "Pitching stats", children: pitching },
      { name: "Fielding stats", children: fielding },
      { name: "Hitting stats", children: hitting } ] },
  { name: "Rosters", count: "xx", items: ["Year","Teams"] },
  { name: "Manager-stats", count: "xx", items: ["Manager ID","Team ID"] },
  { name: "Awards", count: "xx", items: ["Award","Player ID","Team ID","Year"] },
  { name: "Team-stats", count: "xx", items: ["Division at the time","League at the time","Name at the time","Team ID"] },
  { name: "Standings", count: "xx", items: ["Clinched","Division at the time","Division rank","Losses","Team ID","Winning percentage","Wins"] },
  { name: "Standings-splits", count: "xx", items: ["Year","Updated","Teams",
      { name: "Each team", children: ["Team ID","Wins","Losses","Winning percentage","Runs scored","Runs allowed","Run differential","Games behind","Wild card games behind"] },
      { name: "Splits", children: ["Home","Away","Left","Left home","Left away","Right","Right home","Right away","Last ten games","Extra-inning games","One-run games","Day games","Night games","Grass","Turf"] },
      { name: "Expected record", children: ["Expected win-loss record","Expected win-loss record for the season"] } ] },
  { name: "Drafts", count: "xx", items: ["Round","Overall pick number","Team ID","Player ID","Player name","Position","School","Birth date","Height","Weight","Bats (left, right or switch)","Throws (left or right)"] },
];

const PREVIEW = 3; // how many entries show before the "more" button

/* ---------- BUILD ---------- */
const ICON = '<svg><use href="#folder"/></svg>';
const $ = (id) => document.getElementById(id);

decades.forEach(([label, note], i) => {
  const d = document.createElement("div");
  d.className = "folder-node";
  d.id = "dec" + i;
  d.innerHTML = `${ICON}<span class="t">${label}<span class="sub">${note}</span></span>`;
  $("decades").appendChild(d);
});

ranges.forEach((label, i) => {
  const d = document.createElement("div");
  d.className = "folder-node" + (label === PICKED_RANGE ? " picked" : "");
  d.id = "rng" + i;
  d.innerHTML = `${ICON}<span class="t">${label}</span>`;
  $("ranges").appendChild(d);
});

function itemHTML(it) {
  if (typeof it === "string") return `<li>${ICON}<span>${it}</span></li>`;
  const kids = it.children.map((c) => `<li>${c}</li>`).join("");
  return `<li class="sub-group"><div class="gname">${ICON}<span>${it.name}</span></div><ul>${kids}</ul></li>`;
}

categories.forEach((cat, i) => {
  const card = document.createElement("article");
  card.className = "card";
  card.id = "cat" + i;
  const first = cat.items.slice(0, PREVIEW).map(itemHTML).join("");
  const rest = cat.items.slice(PREVIEW).map(itemHTML).join("");
  const hidden = cat.items.length - PREVIEW;
  card.innerHTML = `
    <div class="card-head">${ICON}<h3>${cat.name}</h3><span class="count">${cat.count}</span></div>
    <ul>${first}</ul>
    ${hidden > 0 ? `<ul class="rest">${rest}</ul>
    <button class="more" type="button" aria-expanded="false">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="label">${hidden} more</span>
    </button>` : ""}`;
  const btn = card.querySelector(".more");
  if (btn) btn.addEventListener("click", () => {
    const open = card.classList.toggle("open");
    btn.setAttribute("aria-expanded", open);
    btn.querySelector(".label").textContent = open ? "Show less" : `${hidden} more`;
    drawStrands();
  });
  $("cards").appendChild(card);
});

/* ---------- STRANDS (the web connecting everything) ---------- */
const NS = "http://www.w3.org/2000/svg";
function pt(el, where) {
  const f = $("flow").getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left - f.left + r.width / 2, y: (where === "top" ? r.top : r.bottom) - f.top };
}
function strand(svg, a, b, picked) {
  const p1 = pt(a, "bottom"), p2 = pt(b, "top");
  const my = (p1.y + p2.y) / 2;
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", `M${p1.x},${p1.y} C${p1.x},${my} ${p2.x},${my} ${p2.x},${p2.y}`);
  path.setAttribute("class", "strand" + (picked ? " picked" : ""));
  svg.appendChild(path);
  [p1, p2].forEach((p) => {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", picked ? 3.5 : 2.5);
    c.setAttribute("class", "dew" + (picked ? " picked" : ""));
    svg.appendChild(c);
  });
}
function drawStrands() {
  const svg = $("strands");
  svg.innerHTML = "";
  const pickedIdx = ranges.indexOf(PICKED_RANGE);
  strand(svg, $("raw"), $("compress"));
  decades.forEach((_, i) => strand(svg, $("compress"), $("dec" + i)));
  ranges.forEach((_, i) => strand(svg, $("dec" + rangeParent[i]), $("rng" + i), i === pickedIdx));
  strand(svg, $("rng" + pickedIdx), $("year"), true);
  categories.forEach((_, i) => strand(svg, $("year"), $("cat" + i), true));
}

/* ---------- BACKGROUND WEB ---------- */
function drawBg() {
  const svg = $("bgweb");
  const w = innerWidth, h = innerHeight;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.innerHTML = "";
  const cx = w, cy = 0, R = Math.hypot(w, h) * 1.05;
  const spokes = 13, rings = 16;
  const style = "stroke:var(--silk-dim);fill:none;stroke-width:1";
  for (let s = 0; s <= spokes; s++) {
    const a = Math.PI / 2 + (s / spokes) * (Math.PI / 2);
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", cx); l.setAttribute("y1", cy);
    l.setAttribute("x2", cx + Math.cos(a) * R); l.setAttribute("y2", cy + Math.sin(a) * R);
    l.setAttribute("style", style);
    svg.appendChild(l);
  }
  for (let r = 1; r <= rings; r++) {
    const rad = (r / rings) * R * (0.5 + 0.5 * (r / rings));
    let d = "";
    for (let s = 0; s <= spokes; s++) {
      const a = Math.PI / 2 + (s / spokes) * (Math.PI / 2);
      const sag = s > 0 ? rad * 0.965 : rad; // silk sags between spokes
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      if (s === 0) d += `M${x},${y}`;
      else {
        const am = Math.PI / 2 + ((s - 0.5) / spokes) * (Math.PI / 2);
        d += ` Q${cx + Math.cos(am) * sag},${cy + Math.sin(am) * sag} ${x},${y}`;
      }
    }
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d); p.setAttribute("style", style);
    svg.appendChild(p);
  }
}

/* ---------- THEME TOGGLE ---------- */
$("themeToggle").addEventListener("click", () => {
  const root = document.documentElement;
  const light = matchMedia("(prefers-color-scheme: light)").matches;
  const cur = root.dataset.theme || (light ? "light" : "dark");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  if (root.dataset.theme === "light") {
    root.style.cssText = "--bg:#eef1f6;--bg-2:#e3e8f0;--card:#fff;--silk:#55627a;--silk-dim:rgba(85,98,122,.28);--ink:#161b2b;--ink-dim:#55627a;--amber:#b9760a;--folder:#5b6f9a;--folder-hi:#b9760a";
  } else {
    root.style.cssText = "";
  }
});

/* ---------- INIT ---------- */
function redraw() { drawBg(); drawStrands(); }
addEventListener("resize", redraw);
addEventListener("load", redraw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
redraw();
</script>
</body>
</html>
