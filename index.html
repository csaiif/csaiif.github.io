<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baseball data, 1980–2024</title>
  <style>html{background:#04060b;color:#a9bfd1;font-family:system-ui,sans-serif}a{color:#ffb020}body{padding:2rem}</style>
</head>
<body>
  <noscript><p>Pick a version: <a href="desktop.html">Desktop</a> · <a href="mobile.html">Mobile</a></p></noscript>
  <script>
    // Sends phones to the mobile version and everyone else to the desktop version.
    var small = matchMedia('(max-width: 820px)').matches ||
      (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);
    location.replace(small ? 'mobile.html' : 'desktop.html');
  </script>
</body>
</html>
